<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impostor">
<title>Impostor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #D9F2EF; --bg2: #BFE7E2; --ink: #1F2A44; --muted: #4E5D7A;
  --tape: #FF5C8A; --tape-dark: #D93F6E; --label: #FFD23F; --label-ink: #1F2A44;
  --window: #1F2A44; --accent: #00938F; --onaccent: #FFFFFF; --chip: #FFFFFF;
  --rec: #E8263F; --line: rgba(31, 42, 68, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12203A; --bg2: #1B2D4F; --ink: #EAF2FF; --muted: #9FB2D6;
    --tape: #FF5C8A; --tape-dark: #C8396A; --label: #FFD23F; --label-ink: #1F2A44;
    --window: #0C1528; --accent: #3FE0D0; --onaccent: #0C1528; --chip: #1B2D4F;
    --rec: #FF4D63; --line: rgba(234, 242, 255, .16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12203A; --bg2: #1B2D4F; --ink: #EAF2FF; --muted: #9FB2D6;
  --tape: #FF5C8A; --tape-dark: #C8396A; --label: #FFD23F; --label-ink: #1F2A44;
  --window: #0C1528; --accent: #3FE0D0; --onaccent: #0C1528; --chip: #1B2D4F;
  --rec: #FF4D63; --line: rgba(234, 242, 255, .16); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(circle at 20% 0%, var(--bg2), transparent 55%), var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 460px; margin: 0 auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
}
h1 {
  font-family: "Bungee", "Rubik", system-ui, sans-serif; font-weight: 400;
  font-size: clamp(2rem, 11vw, 2.8rem); line-height: .95; margin: 6px 0 4px;
}
h1 .a { color: var(--tape); }
h1 .b { color: var(--accent); }
.sub { color: var(--muted); margin: 0 0 18px; }
h2 { font-size: 1rem; margin: 0 0 10px; font-weight: 800; }
.screen { display: none; }
.screen.active { display: block; }
.box { background: var(--chip); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); font-size: .93rem; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 999px; padding: 5px; gap: 4px; margin-bottom: 14px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 700 .95rem "Rubik", system-ui, sans-serif; padding: 11px 4px; border-radius: 999px; cursor: pointer; touch-action: manipulation; }
.seg button.on { background: var(--ink); color: var(--bg); }
.box .seg { background: var(--bg); margin: 0; }

.names { display: grid; gap: 8px; }
.name-row { display: flex; gap: 8px; }
.name-row input {
  flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 14px; padding: 11px 12px; font: 500 1rem "Rubik", system-ui, sans-serif;
}
.name-row input:focus { outline: none; border-color: var(--accent); }
.x { border: 0; background: var(--bg); color: var(--muted); width: 46px; border-radius: 14px; font-size: 1.2rem; cursor: pointer; }
.add { margin-top: 8px; width: 100%; border: 2px dashed var(--line); background: transparent; color: var(--ink); border-radius: 14px; padding: 11px; font: 700 .95rem "Rubik", system-ui, sans-serif; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 12px; font: 600 .92rem "Rubik", system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--onaccent); }
textarea {
  width: 100%; margin-top: 10px; min-height: 90px; border: 2px solid var(--line); background: var(--bg);
  color: var(--ink); border-radius: 14px; padding: 10px 12px; font: 500 .95rem "Rubik", system-ui, sans-serif; resize: vertical;
}
textarea[hidden] { display: none; }

.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.opt:first-of-type { border-top: 0; padding-top: 0; }
.opt b { display: block; font-weight: 700; }
.opt small { color: var(--muted); font-size: .85rem; display: block; line-height: 1.3; }
.sw { position: relative; flex: none; width: 52px; height: 30px; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .2s; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.sw input:checked + span { background: var(--accent); }
.sw input:checked + span::after { transform: translateX(22px); }
.sw input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.timer-row { padding-top: 12px; border-top: 1px solid var(--line); margin-top: 2px; }
.timer-row b { display: block; margin-bottom: 8px; }

.btn {
  border: 0; border-radius: 18px; padding: 15px 12px; width: 100%;
  font: 700 1.05rem "Rubik", system-ui, sans-serif; cursor: pointer; touch-action: manipulation;
  background: var(--chip); color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.go { background: var(--ink); color: var(--bg); }
.btn.hot { background: var(--tape); color: #fff; box-shadow: 0 5px 0 var(--tape-dark); }
.btn.alt { background: var(--accent); color: var(--onaccent); }
.btn.big { padding: 20px 12px; font-size: 1.15rem; border-radius: 22px; }
.btn:disabled { opacity: .35; cursor: default; }
.stack { display: grid; gap: 10px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.err { display: none; background: var(--chip); border-left: 5px solid var(--rec); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: .95rem; }
.err.show { display: block; }

details { background: var(--chip); border-radius: 20px; padding: 14px 16px; margin-bottom: 14px; }
summary { font-weight: 800; cursor: pointer; }
details ol { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: .94rem; }
details li { margin-bottom: 6px; }

/* Vez do jogador */
.turn { text-align: center; margin: 8px 0 14px; }
.turn .step { color: var(--muted); font-weight: 600; font-size: .9rem; }
.turn .who { font-family: "Bungee", system-ui, sans-serif; font-size: clamp(1.6rem, 9vw, 2.2rem); line-height: 1.05; margin-top: 4px; word-break: break-word; }
.secret {
  position: relative; height: 270px; border-radius: 26px; margin-bottom: 16px;
  background: var(--tape); box-shadow: 0 6px 0 var(--tape-dark);
  display: grid; place-items: center; text-align: center; padding: 20px;
  cursor: pointer; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.secret .cover { color: #fff; font-weight: 800; font-size: 1.15rem; }
.secret .cover .eye { font-size: 3rem; display: block; margin-bottom: 6px; }
.secret .content { display: none; }
.secret.open { background: var(--label); box-shadow: 0 6px 0 #C9A21F; }
.secret.open .cover { display: none; }
.secret.open .content { display: block; color: var(--label-ink); }
.content .word { font-family: "Bungee", system-ui, sans-serif; font-size: clamp(1.7rem, 9vw, 2.4rem); line-height: 1.05; word-break: break-word; }
.content .tag { display: inline-block; margin-top: 12px; background: var(--label-ink); color: var(--label); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: .85rem; }
.content .imp { font-size: 3.2rem; display: block; }

/* Discussão */
.clock { font-family: "Bungee", system-ui, sans-serif; font-size: 3.4rem; text-align: center; line-height: 1; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
.clock.end { color: var(--rec); }
.starter { text-align: center; font-size: 1.05rem; margin-bottom: 4px; }
.starter b { color: var(--tape); }

/* Votação */
.opts { display: grid; gap: 10px; }
.opts .btn { justify-content: flex-start; padding-left: 18px; }
.opts .btn.none { background: transparent; border: 2px dashed var(--line); justify-content: center; padding-left: 12px; }

/* Resultado */
.headline { font-family: "Bungee", system-ui, sans-serif; font-size: clamp(1.5rem, 8vw, 2rem); line-height: 1.1; margin: 8px 0 8px; }
.reveal-word { background: var(--label); color: var(--label-ink); border-radius: 18px; padding: 14px 16px; margin-bottom: 14px; }
.reveal-word small { display: block; font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
.reveal-word strong { font-family: "Bungee", system-ui, sans-serif; font-size: 1.5rem; font-weight: 400; line-height: 1.1; word-break: break-word; }
.reveal-word + .reveal-word { margin-top: -6px; }
.reveal-word.pink { background: var(--tape); color: #fff; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .pts { font-weight: 800; font-variant-numeric: tabular-nums; }
.list .plus { color: var(--accent); font-weight: 800; margin-left: 6px; }
.badge { display: inline-block; background: var(--tape); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: .75rem; font-weight: 700; margin-left: 6px; vertical-align: 2px; }
.guess { background: var(--chip); border: 3px solid var(--tape); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
.guess p { margin: 0 0 12px; }
.linkback { display: block; text-align: center; color: var(--muted); font-size: .9rem; margin-top: 22px; }
.linkback a { color: inherit; }
.small-btn { background: transparent; border: 0; color: var(--muted); font: 600 .9rem "Rubik", system-ui, sans-serif; text-decoration: underline; cursor: pointer; padding: 8px; margin: 6px auto 0; display: block; }

.burst { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.burst i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .8; } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>

  <!-- CONFIGURAÇÃO -->
  <section class="screen active" id="setup">
    <h1><span class="a">Impos</span><span class="b">tor</span></h1>
    <p class="sub">Um celular, várias pessoas, alguém mentindo.</p>

    <div class="seg" id="modeSeg">
      <button data-mode="grupo">👥 Grupo (3+)</button>
      <button data-mode="dupla">💞 Dupla</button>
    </div>

    <details id="rules">
      <summary>Como joga</summary>
      <ol id="rulesList"></ol>
    </details>

    <div class="box">
      <h2>Jogadores</h2>
      <div class="names" id="names"></div>
      <button class="add" id="addName">+ Adicionar jogador</button>
    </div>

    <div class="box">
      <h2>Temas</h2>
      <div class="chips" id="themes"></div>
      <textarea id="custom" hidden placeholder="Suas palavras, separadas por vírgula ou uma por linha. Ex.: tia Neide, churrasco do Beto, viagem pra Ubatuba"></textarea>
    </div>

    <div class="box" id="optsBox">
      <h2>Opções</h2>
      <label class="opt" data-group>
        <span><b>Dica pro impostor</b><small>O impostor vê o nome do tema.</small></span>
        <span class="sw"><input type="checkbox" id="optHint"><span></span></span>
      </label>
      <label class="opt" data-group>
        <span><b>Palavra parecida</b><small>O impostor recebe uma palavra parecida e nem sabe que é o impostor.</small></span>
        <span class="sw"><input type="checkbox" id="optSimilar"><span></span></span>
      </label>
      <label class="opt" data-group>
        <span><b>Modo caos</b><small>Às vezes tem 2 impostores (com 5+ jogadores), às vezes nenhum.</small></span>
        <span class="sw"><input type="checkbox" id="optChaos"><span></span></span>
      </label>
      <div class="timer-row">
        <b>Tempo de conversa</b>
        <div class="seg" id="timerSeg">
          <button data-t="0">Livre</button>
          <button data-t="60">1 min</button>
          <button data-t="90">1:30</button>
          <button data-t="120">2 min</button>
        </div>
      </div>
    </div>

    <div class="err" id="setupErr" role="alert"></div>
    <button class="btn hot big" id="start">Começar</button>
    <button class="small-btn" id="resetScores">Zerar placar</button>
    <p class="linkback"><a href="/">← Fala ao contrário</a></p>
  </section>

  <!-- VER PALAVRA -->
  <section class="screen" id="reveal">
    <div class="turn">
      <div class="step" id="revStep"></div>
      <div class="who" id="revName"></div>
    </div>
    <div class="secret" id="secret" role="button" aria-label="Segure para ver sua palavra">
      <div class="cover"><span class="eye">👀</span>Só <span id="revName2"></span> pode olhar.<br>Segure aqui pra ver.</div>
      <div class="content" id="secretContent"></div>
    </div>
    <button class="btn go big" id="revNext" disabled>Pronto, passar</button>
    <p class="muted" style="text-align:center;margin-top:12px">Soltou o dedo, a palavra some.</p>
  </section>

  <!-- CONVERSA -->
  <section class="screen" id="talk">
    <h1 style="font-size:2rem"><span class="a">Hora das</span> <span class="b">pistas</span></h1>
    <p class="starter">Quem começa: <b id="starter"></b></p>
    <p class="muted" id="talkHint" style="text-align:center"></p>
    <div class="clock" id="clock" hidden>0:00</div>
    <div class="stack">
      <button class="btn alt" id="clockBtn" hidden>▶ Iniciar tempo</button>
      <button class="btn hot big" id="toVote">Votar</button>
    </div>
  </section>

  <!-- VOTAÇÃO -->
  <section class="screen" id="vote">
    <div class="turn">
      <div class="step" id="voteStep"></div>
      <div class="who" id="voteName"></div>
    </div>
    <p class="muted" id="voteQ" style="text-align:center"></p>
    <button class="btn go big" id="voteShow">Sou eu, mostrar opções</button>
    <div class="opts" id="voteOpts" hidden></div>
  </section>

  <!-- RESULTADO -->
  <section class="screen" id="result">
    <div class="headline" id="resHead"></div>
    <p id="resSub" class="muted"></p>
    <div id="resGuess"></div>
    <div id="resBody"></div>
    <div class="stack" id="resBtns">
      <button class="btn hot big" id="again">Nova rodada</button>
      <button class="btn" id="toSetup">Mudar jogadores ou temas</button>
    </div>
  </section>

</main>

      ['Vassoura','Rodo'],['Chuveiro','Banheira'],['Panela','Frigideira'],['Garfo','Colher'],['Copo','Caneca'],
      ['Toalha','Lençol'],['Escova de dente','Fio dental'],['Tapete','Capacho'],['Abajur','Lustre'],['Relógio','Despertador'],
      ['Guarda-roupa','Cômoda'],['Torradeira','Sanduicheira'],['Ferro de passar','Secador de cabelo'],['Lixeira','Balde'],
      ['Cortina','Persiana'],['Chave','Cadeado'],['Televisão','Computador']
    ]},
    { id: 'festas', icon: '🎉', name: 'Festas e datas', pairs: [
      ['Carnaval','Micareta'],['São João','Festa do peão'],['Natal','Ano Novo'],['Páscoa','Dia das Crianças'],
      ['Aniversário','Chá de bebê'],['Casamento','Noivado'],['Formatura','Festa de 15 anos'],['Halloween','Festa à fantasia'],
      ['Dia dos Namorados','Bodas'],['Copa do Mundo','Olimpíadas'],['Black Friday','Liquidação'],['Chá revelação','Chá de fraldas'],
      ['Rock in Rio','Lollapalooza'],['Oktoberfest','Festa da uva'],['Show de stand-up','Show de mágica'],['Sexta-feira 13','Dia da mentira'],
      ['Despedida de solteiro','Chá de panela'],['Festa do pijama','Acampamento'],['Amigo secreto','Bingo'],['Bloco de rua','Trio elétrico'],
      ['Dia das Mães','Dia dos Pais'],['Churrasco de domingo','Almoço de família'],['Réveillon na praia','Queima de fogos'],['Festa surpresa','Festa temática']
    ]}
  ];

  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('impostor.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('impostor.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const S = Object.assign({
    mode: 'grupo', names: ['', '', '', ''], themes: ['comida', 'lugares', 'animais'],
    custom: '', hint: true, similar: false, chaos: false, timer: 90
  }, store.get('settings', {}));
  if (!Array.isArray(S.names)) S.names = ['', '', ''];
  let scores = store.get('scores', {});
  const used = new Set();
  let R = null, tick = null;

  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const save = () => store.set('settings', S);
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }

  /* ---------- Configuração ---------- */
  const minPlayers = () => S.mode === 'dupla' ? 2 : 3;
  const maxPlayers = () => S.mode === 'dupla' ? 2 : 12;
  const shownNames = () => S.mode === 'dupla' ? S.names.slice(0, 2) : S.names;
  const finalNames = () => shownNames().map((n, i) => n.trim() || 'Jogador ' + (i + 1));

  function renderSetup() {
    while (S.names.length < minPlayers()) S.names.push('');
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
    document.querySelectorAll('#timerSeg button').forEach(b => b.classList.toggle('on', +b.dataset.t === S.timer));
    document.querySelectorAll('[data-group]').forEach(el => el.hidden = S.mode === 'dupla');
    $('#optHint').checked = S.hint; $('#optSimilar').checked = S.similar; $('#optChaos').checked = S.chaos;
    $('#optHint').closest('label').style.opacity = S.similar ? .45 : 1;

    const box = $('#names'); box.innerHTML = '';
    shownNames().forEach((n, i) => {
      const row = document.createElement('div'); row.className = 'name-row';
      const inp = document.createElement('input');
      inp.value = n; inp.placeholder = 'Jogador ' + (i + 1); inp.maxLength = 18;
      inp.autocomplete = 'off'; inp.enterKeyHint = 'next';
      inp.addEventListener('input', () => { S.names[i] = inp.value; save(); });
      row.appendChild(inp);
      if (S.mode === 'grupo' && S.names.length > 3) {
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '×';
        x.setAttribute('aria-label', 'Remover jogador ' + (i + 1));
        x.addEventListener('click', () => { S.names.splice(i, 1); save(); renderSetup(); });
        row.appendChild(x);
      }
      box.appendChild(row);
    });
    $('#addName').hidden = S.mode === 'dupla' || S.names.length >= maxPlayers();

    const th = $('#themes'); th.innerHTML = '';
    [...THEMES, { id: 'custom', icon: '✏️', name: 'Personalizado' }].forEach(t => {
      const c = document.createElement('button');
      c.className = 'chip' + (S.themes.includes(t.id) ? ' on' : '');
      c.textContent = t.icon + ' ' + t.name;
      c.setAttribute('aria-pressed', S.themes.includes(t.id));
      c.addEventListener('click', () => {
        S.themes = S.themes.includes(t.id) ? S.themes.filter(x => x !== t.id) : [...S.themes, t.id];
        save(); renderSetup();
      });
      th.appendChild(c);
    });
    $('#custom').hidden = !S.themes.includes('custom');
    $('#custom').value = S.custom;

    const rules = S.mode === 'dupla' ? [
      'Cada um vê uma palavra em segredo, passando o celular.',
      'O jogo sorteia se as duas palavras são iguais ou só parecidas (tipo “praia” e “piscina”).',
      'Conversem dando pistas sobre a sua palavra, sem falar ela.',
      'Cada um vota escondido: “somos iguais” ou “somos diferentes”. Quem acertar ganha 1 ponto.'
    ] : [
      'Passe o celular: cada um segura o dedo na tela pra ver a palavra secreta.',
      'Todo mundo recebe a mesma palavra, menos o impostor.',
      'Em roda, cada um fala uma pista curta sobre a palavra, sem entregar demais.',
      'Votem escondido em quem parece o impostor.',
      'Pegaram o impostor? Ele ainda pode adivinhar a palavra pra virar o jogo.',
      'Pontos: impostor que escapa ganha 2. Se for pego, cada inocente ganha 1, ou ele ganha 1 se adivinhar a palavra.'
    ];
    $('#rulesList').innerHTML = rules.map(r => '<li>' + esc(r) + '</li>').join('');
  }

  $('#modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.mode = b.dataset.mode; save(); hideErr(); renderSetup();
  });
  $('#timerSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.timer = +b.dataset.t; save(); renderSetup();
  });
  $('#addName').addEventListener('click', () => {
    if (S.names.length >= maxPlayers()) return;
    S.names.push(''); save(); renderSetup();
    const ins = document.querySelectorAll('#names input'); ins[ins.length - 1].focus();
  });
  $('#optHint').addEventListener('change', e => { S.hint = e.target.checked; save(); });
  $('#optSimilar').addEventListener('change', e => { S.similar = e.target.checked; save(); renderSetup(); });
  $('#optChaos').addEventListener('change', e => { S.chaos = e.target.checked; save(); });
  $('#custom').addEventListener('input', e => { S.custom = e.target.value; save(); });
  $('#resetScores').addEventListener('click', () => {
    if (!confirm('Zerar o placar de todo mundo?')) return;
    scores = {}; store.set('scores', scores);
    $('#resetScores').textContent = 'Placar zerado ✓';
    setTimeout(() => { $('#resetScores').textContent = 'Zerar placar'; }, 1600);
  });

  const showErr = t => { const e = $('#setupErr'); e.textContent = t; e.classList.add('show'); e.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  const hideErr = () => $('#setupErr').classList.remove('show');

  function customWords() {
    const seen = new Set(), out = [];
    S.custom.split(/[\n,;]+/).map(w => w.trim()).filter(Boolean).forEach(w => {
      const k = w.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(w); }
    });
    return out;
  }

  function pool() {
    const p = [];
    THEMES.forEach(t => { if (S.themes.includes(t.id)) t.pairs.forEach(pr => p.push({ a: pr[0], b: pr[1], theme: t.name })); });
    if (S.themes.includes('custom')) {
      const ws = customWords();
      if (ws.length >= 2) ws.forEach(w => {
        const others = ws.filter(x => x !== w);
        p.push({ a: w, b: others[rnd(others.length)], theme: 'Personalizado' });
      });
    }
    return p;
  }

  function pickPair() {
    const p = pool();
    let free = p.filter(x => !used.has(x.a) && !used.has(x.b));
    if (!free.length) { used.clear(); free = p; }
    const x = free[rnd(free.length)];
    used.add(x.a); used.add(x.b);
    return Math.random() < .5 ? x : { a: x.b, b: x.a, theme: x.theme };
  }

  $('#start').addEventListener('click', () => {
    hideErr();
    const names = finalNames();
    const lower = names.map(n => n.toLowerCase());
    if (names.length < minPlayers()) return showErr('Precisa de pelo menos ' + minPlayers() + ' jogadores.');
    if (new Set(lower).size !== lower.length) return showErr('Tem dois jogadores com o mesmo nome. Troque um deles.');
    if (!S.themes.length) return showErr('Escolha pelo menos um tema.');
    if (S.themes.includes('custom') && customWords().length < 2 && S.themes.length === 1)
      return showErr('No tema personalizado, escreva pelo menos 2 palavras.');
    if (!pool().length) return showErr('Escolha pelo menos um tema com palavras.');
    startRound();
  });

  /* ---------- Rodada ---------- */
  function startRound() {
    stopTick();
    const names = finalNames();
    const pr = pickPair();
    if (S.mode === 'dupla') {
      const same = Math.random() < .5;
      R = { mode: 'dupla', names, pair: pr, same, words: same ? [pr.a, pr.a] : shuffle([pr.a, pr.b]), i: 0, votes: [] };
    } else {
      const n = names.length;
      let k = 1;
      if (S.chaos) { const r = Math.random(); if (r < .12) k = 0; else if (r < .35 && n >= 5) k = 2; }
      const imp = new Set(shuffle([...Array(n).keys()]).slice(0, k));
      R = { mode: 'grupo', names, pair: pr, imp, similar: S.similar, hint: S.hint, chaos: S.chaos, i: 0, votes: [], starter: rnd(n) };
    }
    showReveal();
  }

  function secretHTML(i) {
    const tag = t => '<span class="tag">' + esc(t) + '</span>';
    if (R.mode === 'dupla') return '<div class="word">' + esc(R.words[i]) + '</div>' + tag(R.pair.theme);
    if (R.imp.has(i)) {
      if (R.similar) return '<div class="word">' + esc(R.pair.b) + '</div>' + tag(R.pair.theme);
      return '<span class="imp">🤫</span><div class="word">Você é o impostor</div>' +
        (R.hint ? tag('Tema: ' + R.pair.theme) : '<span class="tag">Sem dica. Boa sorte!</span>');
    }
    return '<div class="word">' + esc(R.pair.a) + '</div>' + tag(R.pair.theme);
  }

  function showReveal() {
    const n = R.names.length, name = R.names[R.i];
    $('#revStep').textContent = 'Passe o celular para · ' + (R.i + 1) + ' de ' + n;
    $('#revName').textContent = name;
    $('#revName2').textContent = name;
    $('#secretContent').innerHTML = secretHTML(R.i);
    $('#secret').classList.remove('open');
    $('#revNext').disabled = true;
    $('#revNext').textContent = R.i === n - 1 ? 'Pronto, começar' : 'Pronto, passar';
    show('reveal');
  }

  const secret = $('#secret');
  const openSecret = e => { e.preventDefault(); secret.classList.add('open'); $('#revNext').disabled = false; buzz(15); };
  const closeSecret = () => secret.classList.remove('open');
  secret.addEventListener('pointerdown', e => { try { secret.setPointerCapture(e.pointerId); } catch (x) {} openSecret(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => secret.addEventListener(ev, closeSecret));
  secret.addEventListener('contextmenu', e => e.preventDefault());
  secret.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') openSecret(e); });
  secret.addEventListener('keyup', closeSecret);
  secret.tabIndex = 0;

  $('#revNext').addEventListener('click', () => {
    closeSecret();
    R.i++;
    if (R.i < R.names.length) showReveal(); else showTalk();
  });

  /* ---------- Conversa ---------- */
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }

  function showTalk() {
    stopTick();
    const starter = R.mode === 'dupla' ? R.names[rnd(2)] : R.names[R.starter];
    $('#starter').textContent = starter;
    $('#talkHint').textContent = R.mode === 'dupla'
      ? 'Falem pistas sobre a sua palavra, um de cada vez. Sem dizer a palavra!'
      : 'Em roda, cada um fala uma pista sobre a palavra. Pode dar mais de uma volta.';
    const clk = $('#clock'), btn = $('#clockBtn');
    clk.classList.remove('end');
    if (S.timer) {
      let left = S.timer;
      clk.hidden = false; btn.hidden = false;
      clk.textContent = fmt(left);
      btn.textContent = '▶ Iniciar tempo';
      btn.onclick = () => {
        if (tick) { stopTick(); btn.textContent = '▶ Continuar'; return; }
        if (left <= 0) { left = S.timer; clk.classList.remove('end'); }
        btn.textContent = '⏸ Pausar';
        tick = setInterval(() => {
          left--; clk.textContent = fmt(Math.max(0, left));
          if (left <= 0) {
            stopTick(); clk.textContent = 'Tempo!'; clk.classList.add('end');
            btn.textContent = '↺ De novo'; buzz([200, 100, 200]);
          }
        }, 1000);
      };
    } else { clk.hidden = true; btn.hidden = true; }
    show('talk');
  }

  $('#toVote').addEventListener('click', () => { stopTick(); R.vi = 0; showVote(); });

  /* ---------- Votação ---------- */
  function showVote() {
    const n = R.names.length;
    $('#voteStep').textContent = 'Voto secreto · ' + (R.vi + 1) + ' de ' + n;
    $('#voteName').textContent = R.names[R.vi];
    $('#voteQ').textContent = R.mode === 'dupla' ? 'Vocês têm a mesma palavra?' : 'Quem é o impostor?';
    $('#voteShow').hidden = false;
    $('#voteShow').textContent = 'Sou ' + R.names[R.vi] + ', mostrar opções';
    const opts = $('#voteOpts'); opts.hidden = true; opts.innerHTML = '';
    const add = (label, val, cls) => {
      const b = document.createElement('button');
      b.className = 'btn' + (cls ? ' ' + cls : ''); b.textContent = label;
      b.addEventListener('click', () => {
        R.votes[R.vi] = val; R.vi++; buzz(15);
        if (R.vi < n) showVote(); else showResult();
      });
      opts.appendChild(b);
    };
    if (R.mode === 'dupla') {
      add('🟰 Somos iguais', 'igual', 'alt');
      add('≠ Somos diferentes', 'diferente', 'hot');
    } else {
      R.names.forEach((nm, j) => { if (j !== R.vi) add(nm, j); });
      if (R.chaos) add('Ninguém é impostor', 'none', 'none');
    }
    show('vote');
  }

  $('#voteShow').addEventListener('click', () => { $('#voteShow').hidden = true; $('#voteOpts').hidden = false; });

  /* ---------- Resultado ---------- */
  function addPoints(gains) {
    Object.entries(gains).forEach(([n, p]) => { scores[n] = (scores[n] || 0) + p; });
    store.set('scores', scores);
  }

  function burst() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = document.createElement('div'); box.className = 'burst';
    const colors = [css('--tape'), css('--label'), css('--accent')];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[i % 3];
      p.style.animationDelay = Math.random() * .5 + 's';
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2400);
  }

  function voteLabel(v) { return v === 'none' ? 'Ninguém' : v === 'igual' ? 'Iguais' : v === 'diferente' ? 'Diferentes' : R.names[v]; }

  function finish(head, sub, gains) {
    addPoints(gains);
    $('#resHead').textContent = head;
    $('#resSub').textContent = sub || '';
    $('#resGuess').innerHTML = '';
    let html = '';
    if (R.mode === 'dupla') {
      html += '<div class="reveal-word"><small>' + esc(R.names[0]) + '</small><strong>' + esc(R.words[0]) + '</strong></div>';
      html += '<div class="reveal-word ' + (R.same ? '' : 'pink') + '"><small>' + esc(R.names[1]) + '</small><strong>' + esc(R.words[1]) + '</strong></div>';
    } else {
      html += '<div class="reveal-word"><small>Palavra · ' + esc(R.pair.theme) + '</small><strong>' + esc(R.pair.a) + '</strong></div>';
      if (R.imp.size) {
        const imps = [...R.imp].map(i => R.names[i]).join(' e ');
        html += '<div class="reveal-word pink"><small>' + (R.imp.size > 1 ? 'Impostores' : 'Impostor') + '</small><strong>' + esc(imps) + '</strong>' +
          (R.similar ? '<small style="margin-top:4px;opacity:.9">Palavra dele: ' + esc(R.pair.b) + '</small>' : '') + '</div>';
      } else {
        html += '<div class="reveal-word pink"><small>Impostor</small><strong>Ninguém 😈</strong></div>';
      }
    }
    html += '<div class="box"><h2>Votos</h2><ul class="list">' +
      R.names.map((n, i) => '<li><span>' + esc(n) + '</span><span class="muted">' + esc(voteLabel(R.votes[i])) + '</span></li>').join('') +
      '</ul></div>';
    const ranked = R.names.map(n => [n, scores[n] || 0]).sort((a, b) => b[1] - a[1]);
    html += '<div class="box"><h2>Placar</h2><ul class="list">' +
      ranked.map(([n, p]) => '<li><span>' + esc(n) + (gains[n] ? '<span class="plus">+' + gains[n] + '</span>' : '') + '</span><span class="pts">' + p + '</span></li>').join('') +
      '</ul></div>';
    $('#resBody').innerHTML = html;
    $('#resBtns').hidden = false;
    show('result');
    burst();
  }

  function showResult() {
    $('#resBody').innerHTML = ''; $('#resGuess').innerHTML = ''; $('#resSub').textContent = '';
    const g = {};
    if (R.mode === 'dupla') {
      R.names.forEach((n, i) => { if ((R.votes[i] === 'igual') === R.same) g[n] = 1; });
      const hits = Object.keys(g).length;
      const head = R.same ? 'Eram iguais!' : 'Eram diferentes!';
      const sub = hits === 2 ? 'Os dois acertaram. Sintonia total.' : hits === 1 ? Object.keys(g)[0] + ' acertou.' : 'Ninguém acertou. Blefe de mestre!';
      return finish(head, sub, g);
    }

    const tally = {};
    R.votes.forEach(v => { tally[v] = (tally[v] || 0) + 1; });
    const entries = Object.entries(tally).sort((a, b) => b[1] - a[1]);
    const tie = entries.length > 1 && entries[1][1] === entries[0][1];
    const topKey = tie ? null : entries[0][0];
    const innocents = R.names.filter((_, i) => !R.imp.has(i));
    const imps = [...R.imp].map(i => R.names[i]);

    if (R.imp.size === 0) {
      R.names.forEach((n, i) => { if (R.votes[i] === 'none') g[n] = 1; });
      return finish(topKey === 'none' ? 'Não tinha impostor! Vocês sacaram.' : 'Pegadinha: não tinha impostor!',
        'Quem votou em “ninguém” ganha 1 ponto.', g);
    }
    if (topKey === null) {
      imps.forEach(n => g[n] = 2);
      return finish('Empate! O impostor escapou.', 'Votação empatada, ninguém foi eliminado.', g);
    }
    if (topKey === 'none') {
      imps.forEach(n => g[n] = 2);
      return finish('Tinha impostor sim!', 'A maioria achou que não tinha ninguém.', g);
    }
    const accused = +topKey;
    if (!R.imp.has(accused)) {
      imps.forEach(n => g[n] = 2);
      return finish('O impostor venceu!', 'Vocês votaram em ' + R.names[accused] + ', que era inocente.', g);
    }

    // Impostor pego: última chance
    const name = R.names[accused];
    $('#resHead').textContent = name + ' foi pego!';
    $('#resSub').textContent = '';
    $('#resBtns').hidden = true;
    $('#resGuess').innerHTML =
      '<div class="guess"><p><b>Última chance, ' + esc(name) + '.</b> Fale em voz alta qual você acha que era a palavra. Depois alguém toca no botão.</p>' +
      '<button class="btn" id="showWord" style="margin-bottom:10px">Mostrar a palavra pra conferir</button>' +
      '<div class="pair"><button class="btn alt" id="gotIt">Acertou</button><button class="btn hot" id="missed">Errou</button></div></div>';
    show('result');
    $('#showWord').addEventListener('click', e => { e.target.textContent = 'A palavra era: ' + R.pair.a; e.target.disabled = true; });
    $('#gotIt').addEventListener('click', () => {
      imps.forEach(n => g[n] = 1);
      finish('Virou o jogo!', name + ' foi pego, mas acertou a palavra.', g);
    });
    $('#missed').addEventListener('click', () => {
      innocents.forEach(n => g[n] = 1);
      finish('Os inocentes venceram!', name + ' era o impostor e não acertou a palavra.', g);
    });
  }

  $('#again').addEventListener('click', startRound);
  $('#toSetup').addEventListener('click', () => { stopTick(); renderSetup(); show('setup'); });

  renderSetup();
})();
</script>
</body>
</html>
